name: Publish rndrsbc to PyPI (manual)

# Fallback publisher. The PRIMARY release path builds+uploads INLINE inside
# release.yml, so the publish can never be skipped by GitHub suppressing an
# Actions-created tag push (the bug that kept 0.7.0/0.7.1 off PyPI).
# This workflow exists only for manual/hands-on re-publishing:
#   * workflow_dispatch  -> re-publish the current default branch
#   * push: tags v*      -> re-publish if someone pushes a tag by hand
#
# Wheels are pure-Python (py3-none-any), so a single job builds sdist + wheel.
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # trusted publishing via OIDC, no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Sanity-check the wheel imports
        run: |
          WH=$(ls dist/*.whl | head -1)
          python -m pip install --quiet --target=/tmp/wheel_smoke "$WH"
          PYTHONPATH=/tmp/wheel_smoke python - <<'PY'
          from rndrsbc import doctor, _registry_cli, _update  # noqa: F401
          import core.oauth, core.pipeline, core.panel_health   # noqa: F401
          import core.migrations, core.canvas                    # noqa: F401
          import displays.virtual, displays.waveshare             # noqa: F401
          import server.scheduler, server.onboarding             # noqa: F401
          import widgets.clock.widget                            # noqa: F401
          print("wheel imports OK")
          PY

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
