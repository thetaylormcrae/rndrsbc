name: Publish rndrsbc to PyPI

# Build + upload to PyPI on a version tag (v*). Wheels are pure-Python
# (py3-none-any), so a single job builds both sdist and wheel — no matrix.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual re-publish of the current state

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # trusted publishing via OIDC, no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: |
          # Isolated build: lets hatchling resolve from [build-system].requires.
          # --no-isolation previously failed because ``hatchling`` isn't installed
          # in the runner env and the backend couldn't be imported.
          python -m build

      - name: Sanity-check the wheel imports
        run: |
          # Install into a clean dir and deep-import the real modules the platform
          # ships. NOTE: do NOT use ``rndrsbc --help`` here — __main__ has no
          # --help handler, so it falls through to Frame mode and boots the whole
          # production server (blocking). Deep imports verify the wheel without
          # launching the runtime.
          WH=$(ls dist/*.whl | head -1)
          python -m pip install --quiet --target=/tmp/wheel_smoke "$WH"
          PYTHONPATH=/tmp/wheel_smoke python - <<'PY'
          from rndrsbc import doctor, _registry_cli, _update  # noqa: F401
          import core.oauth, core.pipeline, core.panel_health   # noqa: F401
          import core.migrations, core.canvas                    # noqa: F401
          import displays.virtual, displays.waveshare             # noqa: F401
          import server.scheduler, server.onboarding             # noqa: F401
          import widgets.clock.widget                            # noqa: F401
          print("wheel imports OK")
          PY

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # idempotent tag re-publish
