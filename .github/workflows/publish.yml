name: Publish rndrsbc to PyPI

# Build + upload to PyPI on a version tag (v*). Wheels are pure-Python
# (py3-none-any), so a single job builds both sdist and wheel — no matrix.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual re-publish of the current state

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # trusted publishing via OIDC, no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --no-isolation

      - name: Sanity-check the wheel imports
        run: |
          python -m pip install --quiet dist/rndrsbc-*.whl
          rndrsbc --help

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # idempotent tag re-publish
