name: Release (auto-detect version from file)

# The release version is derived from core/__init__.py, never from a hand-cut
# tag. This fixes the drift bug where "creating a release" didn't update the
# inner version, so PyPI would reject the built artifact (same version
# re-uploaded). Two responsibilities:
#   1. PR gate  — detect the inner version a PR will ship and report whether it
#      actually bumps the published package (so a release must carry a bump).
#   2. Push tag — on merge to main, read __version__ from the file and create
#      the v<version> tag automatically. publish.yml then fires on that tag.
# A hand-cut tag that disagrees with core/__init__.py is now impossible: the
# tag is generated FROM the file.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  # ---- PR gate: report the version this PR will publish vs what's live ----
  release-readiness:
    name: Version readiness (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bump: ${{ steps.ver.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For PRs, check the merge result so we judge the combined tree, not
          # just the head branch in isolation.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Read inner version from file
        id: ver
        run: |
          V=$(python3 -c 'import re;print(re.search(r"__version__\s*=\s*\"([^\"]+)\"",open("core/__init__.py").read()).group(1))')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Inner version (core/__init__.py): $V"

      - name: Compare against published PyPI version
        id: compare
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          LIVE=$(curl -s https://pypi.org/pypi/rndrsbc/json | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])')
          echo "Live on PyPI: $LIVE"
          python3 - "$V" "$LIVE" <<'PY'
          import sys
          from packaging.version import Version  # available on ubuntu-latest runners
          v = Version(sys.argv[1]); live = Version(sys.argv[2])
          if v > live:
              print(f"READY: file version {v} bumps published {live} (release-worthy)")
          elif v == live:
              print(f"NOT-A-BUMP: file version {v} == published {live}. A release PR must bump core/__init__.py __version__.")
          else:
              print(f"BEHIND: file version {v} is lower than published {live} — can't release and would be rejected.")
          PY

      - name: Gate on release intent
        env:
          BUMP: ${{ steps.ver.outputs.version }}
        run: |
          # Non-blocking reporter for feature PRs (which legitimately keep the
          # version unchanged). Clear signal only — CI correctness is gated by
          # test.yml. A release PR must ship a __version__ bump in
          # core/__init__.py; this surfaces that verdict in the run log.
          echo "Release readiness: $(git log -1 --format=%h) carries inner version $BUMP"
          echo "(Automated tag will be created from this version on merge to main.)"

  # ---- Merge-to-main: auto-create the release tag from the file ----
  auto-tag:
    name: Auto-tag release (push to main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needs to push the v<version> tag
    steps:
      - uses: actions/checkout@v4

      - name: Read inner version from file
        id: ver
        run: |
          V=$(python3 -c 'import re;print(re.search(r"__version__\s*=\s*\"([^\"]+)\"",open("core/__init__.py").read()).group(1))')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Inner version: $V"

      - name: Create and push release tag (if new)
        id: tag
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping (no new release)."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Tag is taken FROM the file version, so it can't drift from it.
            git tag -a "$TAG" -m "Release $V (auto-detected from core/__init__.py)"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created + pushed tag $TAG"
          fi

      - name: Release summary
        if: steps.tag.outputs.created == 'true'
        run: |
          echo "Pushed v${{ steps.ver.outputs.version }} — publish.yml will now build and upload this version."
