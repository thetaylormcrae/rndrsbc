name: Semantic Release

# Version is derived from Conventional Commits, not edited by hand.
# On merge to main, Python Semantic Release:
#   * analyzes commits since the last tag
#   * computes the correct semver segment (major / minor / patch) from:
#       - BREAKING CHANGE / feat!  -> major
#       - feat:                    -> minor
#       - fix: and other types     -> patch
#   * bumps __version__ in core/__init__.py
#   * regenerates CHANGELOG.md from the release notes
#   * commits those two, then cuts + pushes the vX.Y.Z tag
# The tag fires publish.yml, which builds and uploads exactly that version.
#
# No hand-cut tags: the tag is generated from the computed version, so a tag
# can never disagree with core/__init__.py again.

on:
  push:
    branches: ["main"]
  # shared-jobs trick: the "release" job runs on a tag only in publish.yml;
  # here we prevent PSR from reprocessing its own tag push below.

jobs:
  # PR gate: enforce Conventional Commit titles so PSR can categorize reliably.
  conventional-lint:
    name: Enforce Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: CondeNast/conventional-pull-request-action@v0.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit-title-match: 'true'
          ignore-merge-commits: 'true'

  # Release on merge to main: semver is computed by PSR.
  release:
    name: Semantic Release (push to main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release  # one release at a time; tag push won't re-trigger
    permissions:
      contents: write     # PSR commits version bump + CHANGELOG and pushes tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PSR needs access to the tag it creates *and* a token able to push.
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Run semantic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v publish

      - name: Report new version
        run: |
          echo "Release tag created by PSR; publish.yml will build it."
