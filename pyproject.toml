[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rndrsbc"
description = "Native E-Paper Operating Platform for Raspberry Pi color e-paper panels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rndrSBC" }]
dynamic = ["version"]

dependencies = [
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "werkzeug>=3.0.0",
    "qrcode[pil]>=7.4.0",
]

[project.optional-dependencies]
pi = ["RPi.GPIO", "spidev", "inky", "gpiod", "gpiodevice", "smbus2"]
dev = ["build", "twine"]

[project.scripts]
rndrsbc = "rndrsbc.__main__:main"

[project.urls]
Homepage = "https://github.com/thetaylormcrae/rndrsbc"

[tool.hatch.version]
path = "core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["core", "displays", "widgets", "server", "rndrsbc", "assets"]
force-include = { "main.py" = "main.py", "config.template.json" = "config.template.json" }

[tool.hatch.build.targets.sdist]
include = [
    "/core", "/displays", "/widgets", "/server", "/rndrsbc",
    "/assets", "/main.py", "/config.template.json", "/requirements.txt",
    "/pyproject.toml", "/README.md",
]

[tool.semantic_release]
# Version source is core/__init__.py (hatch reads it via tool.hatch.version.path).
# PSR writes the computed semver bump straight into that file.
version_variables = ["core/__init__.py:__version__"]
build_command = ""
commit_parser = "conventional"

# Keep releasing on the 0.x line rather than jumping straight to 1.0.0.
# - allow_zero_version: true -> don't force a MAJOR bump just because major == 0
# - major_on_zero: true -> a breaking change on 0.x bumps the minor (0.2.0 -> 0.3.0)
allow_zero_version = true
major_on_zero = true

[tool.semantic_release.branches]
main = { match = "main" }

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^(docs|chore|refactor|style|test|build|ci):"]
mode = "update"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
